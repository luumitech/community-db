branches:
  - main

# Don't publish to npm, and don't read version from package.json
npm: false

git:
  commit: false
  # installing plugins during release will dirty the working directory
  requireCleanWorkingDir: false
  tag: true
  tagName: "v${version}"
  requireBranch: main
  push: true

github:
  release: true
  releaseName: "v${version}"

plugins:
  "@release-it/conventional-changelog":
    preset: angular
